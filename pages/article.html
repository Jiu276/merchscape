<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Merchscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="section" style="padding-top:7rem">
      <div class="container">
        <article class="article-detail" id="article-content"></article>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <div id="back-to-top-mount"></div>
  <script type="module">
    import { initLayout } from '../js/app.js';
    import { articles } from '../js/data.js';
    import { findById, initScrollAnimations } from '../js/utils.js';
    import { renderRelatedArticles } from '../components/related-articles.js';

    initLayout('blog', '../');
    const id = new URLSearchParams(location.search).get('id');
    const article = findById(id, articles);
    const el = document.getElementById('article-content');

    if (!article) {
      el.innerHTML = '<div class="empty-state"><h2>Article Not Found</h2><p><a href="blog.html">Back to Blog</a></p></div>';
    } else {
      document.title = article.title + ' | merchscape';
      const date = new Date(article.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      el.innerHTML = `
        <div class="article-hero-image"><img src="${article.image}" alt="${article.title}"></div>
        <span class="card-category">${article.category}</span>
        <h1>${article.title}</h1>
        <div class="article-meta">
          <span>By ${article.author}</span>
          <span>${date}</span>
          <span>${article.readTime} read</span>
        </div>
        <div class="article-content">${article.content}</div>
        ${renderRelatedArticles(article, articles, '../')}
      `;
      initScrollAnimations();
    }
  </script>
</body>
</html>
