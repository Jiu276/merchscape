<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Merchscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="section" style="padding-top:7rem">
      <div class="container">
        <div class="product-detail" id="product-content"></div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <div id="back-to-top-mount"></div>
  <script type="module">
    import { initLayout } from '../js/app.js';
    import { products } from '../js/data.js';
    import { findById } from '../js/utils.js';

    initLayout('products', '../');
    const id = new URLSearchParams(location.search).get('id');
    const product = findById(id, products);
    const el = document.getElementById('product-content');

    if (!product) {
      el.innerHTML = '<div class="empty-state"><h2>Product Not Found</h2><p><a href="products.html">Back to Products</a></p></div>';
    } else {
      document.title = product.name + ' | merchscape';
      const stars = '★'.repeat(Math.floor(product.rating));
      el.innerHTML = `
        <div class="product-detail-image"><img src="${product.image}" alt="${product.name}"></div>
        <div class="product-detail-info">
          <span class="card-category">${product.category}</span>
          <h1>${product.name}</h1>
          <div class="product-rating">${stars} ${product.rating} / 5</div>
          <div class="product-price">${product.price}</div>
          <p class="product-desc">${product.description}</p>
          <a href="contact.html" class="btn btn-primary">Get Recommendation</a>
        </div>
        <div class="article-content" style="grid-column:1/-1;margin-top:2rem">${product.content}</div>
      `;
    }
  </script>
</body>
</html>
